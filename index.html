<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymStars</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e1b4b,#312e81);
color:white;
min-height:100vh;
overflow-x:hidden;
}

.stars{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
z-index:-1;
}

.star{
position:absolute;
background:white;
border-radius:50%;
animation:twinkle 4s infinite;
}

@keyframes twinkle{
50%{opacity:.2}
}

header{
text-align:center;
padding:40px 20px;
}

h1{
font-size:60px;
background:linear-gradient(90deg,#38bdf8,#ffffff,#c084fc);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.tagline{
font-size:22px;
color:#cbd5e1;
margin-top:10px;
}

.upload-box{
max-width:900px;
margin:30px auto;
display:flex;
gap:10px;
padding:20px;
}

.upload-box input{
flex:1;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
}

.upload-box button{
padding:15px 25px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#06b6d4,#8b5cf6);
color:white;
font-weight:bold;
cursor:pointer;
}

.video-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
padding:20px;
max-width:1400px;
margin:auto;
}

.video-card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
border-radius:20px;
padding:15px;
transition:.3s;
}

.video-card:hover{
transform:translateY(-6px);
box-shadow:0 0 20px rgba(139,92,246,.5);
}

.video-card iframe{
width:100%;
height:220px;
border:none;
border-radius:12px;
}

.video-title{
margin-top:10px;
font-size:18px;
font-weight:bold;
}

footer{
text-align:center;
padding:30px;
color:#cbd5e1;
}

@media(max-width:600px){
h1{
font-size:42px;
}
.upload-box{
flex-direction:column;
}
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<header>
<h1>GYMSTARS</h1>
<div class="tagline">Amazing Gymnastics Videos For Kids</div>
</header>

<input id="videoUrl" placeholder="Paste YouTube Video URL Here">
